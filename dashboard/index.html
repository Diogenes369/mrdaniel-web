<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <!-- Assistant joins Heebo/Rubik for the carousel painter: it is the cleanest Hebrew face at
       paragraph and chip size, where Rubik's heavier cuts get muddy. See designAssets.ts.
       Secular One (headline) + Karantina (condensed plaque label) are the vintage-showcase
       preset's own faces — see FONT_VINTAGE_DISPLAY / FONT_VINTAGE_PLAQUE in designAssets.ts.
       Noto Sans Hebrew is loaded WITH its width axis: the slide headlines are set condensed
       (FONT_HEADLINE), and without `wdth` the browser has no narrow cut to pick. Playpen Sans
       Hebrew is the handwritten margin-note face (FONT_HAND). See DESIGN.md → Typography. -->
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Heebo:wght@100..900&family=Rubik:wght@300..900&family=JetBrains+Mono:wght@400;500;600;700&family=Secular+One&family=Karantina:wght@300;400;700&family=Noto+Sans+Hebrew:wdth,wght@62.5..100,400..900&family=Playpen+Sans+Hebrew:wght@400..700&display=swap" rel="stylesheet" />
  <title>Live Dashboard — דניאל בן ברוך</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
